<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description"
        content="Personal manga and webtoon reader — seamless PDF reading from your GitHub cloud library.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MangaCloud Reader</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ==================== AUTH / LOCK VIEW ==================== -->
    <div id="view-auth" class="view active">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-icon-badge">
                    <span class="auth-icon">📚</span>
                </div>
                <h1 class="auth-title">MangaCloud</h1>
                <p class="auth-subtitle">Enter password to access your cloud library</p>
                <form id="auth-form" class="auth-form" autocomplete="off">
                    <div class="auth-input-wrapper">
                        <input class="auth-input" id="password-input" type="password" placeholder="Enter password" autocomplete="current-password" spellcheck="false" required>
                        <button type="button" class="auth-toggle-btn" id="btn-toggle-password" aria-label="Toggle password visibility" title="Show/hide password">
                            <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                        </button>
                    </div>
                    <button type="submit" class="auth-submit-btn" id="btn-unlock">Unlock Library</button>
                    <div class="auth-error" id="auth-error">Incorrect password. Please try again.</div>
                </form>
            </div>
        </div>
    </div>

    <!-- ==================== LIBRARY VIEW ==================== -->
    <div id="view-library" class="view">
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="title-icon">📚</span>
                    MangaCloud
                </h1>
                <p class="app-subtitle">Your personal cloud library</p>
                <button class="btn-lock" id="btn-lock-app" aria-label="Lock library" title="Lock library">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                </button>
            </div>
        </header>
        <section class="continue-reading" id="continue-reading" style="display:none">
            <h2 class="continue-reading-title">Continue Reading</h2>
            <div class="continue-reading-list" id="continue-reading-list"></div>
        </section>
        <main class="library-grid" id="library-grid">
            <!-- Folder cards injected here -->
        </main>
    </div>

    <!-- ==================== SERIES VIEW ==================== -->
    <div id="view-series" class="view">
        <header class="app-header">
            <div class="header-content">
                <button class="btn-back" id="btn-back-library" aria-label="Back to library">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5" />
                        <path d="M12 19l-7-7 7-7" />
                    </svg>
                </button>
                <div>
                    <h1 class="view-title" id="series-title">Series</h1>
                    <p class="view-subtitle" id="series-subtitle">Browse your collection</p>
                </div>
            </div>
        </header>
        <main class="series-list" id="series-list">
            <!-- Series cards injected here -->
        </main>
    </div>

    <!-- ==================== CHAPTERS VIEW ==================== -->
    <div id="view-chapters" class="view">
        <header class="app-header">
            <div class="header-content">
                <button class="btn-back" id="btn-back-series" aria-label="Back to series">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5" />
                        <path d="M12 19l-7-7 7-7" />
                    </svg>
                </button>
                <div class="chapters-header-info">
                    <h1 class="view-title" id="chapters-title">Chapters</h1>
                    <p class="view-subtitle" id="chapters-subtitle">Select a chapter to read</p>
                </div>
                <div class="ao3-mode-selector" id="ao3-mode-selector" style="display:none">
                    <button class="ao3-mode-btn active" id="btn-ao3-text" data-mode="text" title="Read as formatted text">📝 Text</button>
                    <button class="ao3-mode-btn" id="btn-ao3-pdf" data-mode="pdf" title="Read as original PDF">📄 PDF</button>
                </div>
            </div>
        </header>
        <main class="chapters-list" id="chapters-list">
            <!-- Chapter items injected here -->
        </main>
    </div>

    <!-- ==================== READER VIEW ==================== -->
    <div id="view-reader" class="view">
        <header class="reader-header" id="reader-header">
            <div class="header-content">
                <button class="btn-back" id="btn-back-chapters" aria-label="Back to chapters">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5" />
                        <path d="M12 19l-7-7 7-7" />
                    </svg>
                </button>
                <div class="reader-header-info">
                    <h1 class="view-title" id="reader-title">Reading</h1>
                    <p class="view-subtitle" id="reader-progress">Page 0 / 0</p>
                </div>
                <button class="btn-reader-mode" id="btn-toggle-mode" aria-label="Toggle view mode" title="Switch view mode" style="display:none">
                    <span id="toggle-mode-icon">📄</span>
                    <span id="toggle-mode-text" class="toggle-mode-text">PDF</span>
                </button>
                <button class="btn-bookmark" id="btn-bookmark" aria-label="Bookmark position" title="Mark reading position">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z" />
                    </svg>
                </button>
                <button class="btn-download" id="btn-download" aria-label="Download chapter">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                </button>
            </div>
        </header>
        <div class="reader-container" id="reader-container">
            <!-- PDF canvases stacked here -->
        </div>

        <!-- Chapter navigation -->
        <div class="chapter-nav" id="chapter-nav">
            <button class="chapter-nav-btn" id="btn-prev-chapter" aria-label="Previous chapter">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5" />
                    <path d="M12 19l-7-7 7-7" />
                </svg>
                <span>Prev</span>
            </button>
            <button class="chapter-nav-btn" id="btn-next-chapter" aria-label="Next chapter">
                <span>Next</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14" />
                    <path d="M12 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>

    <!-- ==================== LOADING OVERLAY ==================== -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loader">
            <div class="loader-spinner"></div>
            <p class="loader-text" id="loader-text">Loading...</p>
        </div>
    </div>

    <!-- ==================== TOAST ==================== -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>

</html>
